name: Download Typhoon CSV

on:
  schedule:
    # Run every 30 minutes (DeepMind publishes at 00/06/12/18 UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download missing CSV files
        run: |
          mkdir -p data
          MODELS="OPER WNV3"
          TYPES="ensemble ensemble_mean"

          # 只回溯最近 7 天：页面的批次选择器只看最近 5 天，/api/latest_available 只看最近 3 天，
          # 回溯 30 天会多下载近 500MB（WNV3 单份 ensemble 就有 2.3MB），首次运行又慢又容易失败。
          for offset in $(seq 0 6); do
            DATE=$(date -u -d "${offset} days ago" +%Y_%m_%d)
            for hour in 00 06 12 18; do
              TIMESTAMP="${DATE}T${hour}_00"
              for model in $MODELS; do
                for dtype in $TYPES; do
                  FILE="data/${model}_${dtype}_${TIMESTAMP}_paired.csv"
                  # Skip if already exists and large enough
                  if [ -f "$FILE" ]; then
                    SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
                    if [ "$SIZE" -ge 1000 ]; then
                      echo "Exists: $FILE (${SIZE} bytes)"
                      continue
                    fi
                    echo "Too small, re-download: $FILE"
                    rm -f "$FILE"
                  fi

                  URL="https://deepmind.google.com/science/weatherlab/download/cyclones/${model}/${dtype}/paired/csv/${model}_${TIMESTAMP}_paired.csv"
                  echo "Downloading $URL"
                  HTTP_CODE=$(curl -sL -o "$FILE" -w "%{http_code}" -H "User-Agent: Mozilla/5.0" "$URL" || true)
                  SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
                  if [ "$SIZE" -lt 1000 ] || [ "$HTTP_CODE" != "200" ]; then
                    echo "  Not available yet (HTTP $HTTP_CODE, size $SIZE)"
                    rm -f "$FILE"
                  else
                    echo "  Downloaded: $FILE (${SIZE} bytes)"
                  fi
                done
              done
            done
          done

      - name: Clean old files (keep 30 days)
        run: |
          # 注意：不能按 mtime 清理。actions/checkout 出来的文件 mtime 全是"刚刚"，
          # 原来的 `find -mtime +30 -delete` 永远匹配不到任何文件，仓库只会一路变大。
          # 改成按文件名里的批次日期判断。
          CUTOFF=$(date -u -d '30 days ago' +%Y_%m_%d)
          echo "Removing files older than $CUTOFF"
          for f in data/*.csv; do
            [ -e "$f" ] || continue
            # 已停用的模型（旧版是 FNV3/FNV3P2/GENC）留下的历史文件直接清掉，
            # 不用等它们自然老化到 30 天。只匹配已知的旧模型前缀，
            # 不动其他任何文件（万一以后 data/ 里放了清单之类的）
            case "$f" in
              data/FNV3_*|data/FNV3P2_*|data/GENC_*)
                echo "  remove legacy model file: $f"; rm -f "$f"; continue ;;
            esac
            stamp=$(basename "$f" | sed -n 's/.*_\([0-9]\{4\}_[0-9]\{2\}_[0-9]\{2\}T[0-9]\{2\}_00\)_paired\.csv$/\1/p')
            [ -z "$stamp" ] && continue
            day=${stamp:0:10}
            if [[ "$day" < "$CUTOFF" ]]; then
              echo "  remove $f ($day)"
              rm -f "$f"
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "Auto-update typhoon CSV data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
